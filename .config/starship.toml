"$schema" = 'https://starship.rs/config-schema.json'

format = """
$time\
$username$hostname\
$all\
${custom.git_identity}\
$line_break$status$character"""

[time]
disabled = false
time_format = "%R"
style = "bold white"
format = '[$time ]($style)'

[status]
disabled = false
symbol = ""
format = "[$status ]($style)"

[custom.git_identity]
description = "Show git user.name and user.email"
command = '''
name=$(git config --get user.name 2>/dev/null)
email=$(git config --get user.email 2>/dev/null)

if [ -n "$name" ] && [ -n "$email" ]; then
  printf "👤 %s :: 📧 %s" "$name" "$email"
elif [ -n "$name" ]; then
  printf "👤 %s" "$name"
elif [ -n "$email" ]; then
  printf "📧 %s" "$email"
fi
'''
when = "git rev-parse --is-inside-work-tree 2>/dev/null"
style = "bold yellow"
format = "[$output]($style) "
shell = ["bash", "--noprofile", "--norc"]
